# One-click Render Blueprint: a free live demo of Watchfloor, open to the public.
#
# Free-tier behaviour is exactly right for a demo with metered upstream APIs:
# the service spins down after 15 idle minutes (so it spends no OpenSky
# credits and holds no AISStream connection while nobody is looking) and
# wakes on the next visit in about a minute. The picture cache is off —
# the free filesystem is ephemeral anyway — so each wake starts clean and
# the feeds fill the world back in within a minute or two.
#
# Visitors don't multiply upstream use: only the server talks to the feeds,
# and one poll serves every viewer. The settings below keep it inside the
# free budgets even if someone is watching all day, and keep one visitor from
# taking the whole (tiny) server.
#
# The three secrets are set in the Render dashboard when the blueprint is
# first applied (sync: false below): OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET,
# AISSTREAM_API_KEY. They never live in this repository. Use your one
# OpenSky account: OpenSky's API docs say registering several accounts gets
# all of them banned for life. The 3-minute polls below leave most of its
# daily credits for your home server. Give this site its own AISStream key
# if your account allows one: a key allows three connections at once.
# OpenSky also says it may block cloud providers' addresses; if it blocks
# Render's, the status bar says so and aircraft come from adsb.lol and
# adsb.fi where visitors zoom in.
services:
  - type: web
    name: watchfloor
    runtime: node
    plan: free
    rootDir: projects/watchfloor
    buildCommand: npm ci && npm run build
    startCommand: cd server && node --enable-source-maps dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PICTURE_FILE
        value: "off"
      # No OpenSky: its API docs warn it may block cloud providers' addresses,
      # and from Render every request failed ("fetch failed", Nov 2026).
      # Aircraft come from adsb.lol and adsb.fi, which cover a region at a
      # time, so the site opens on one of the busiest stretches of sky and sea
      # anywhere, kept warm, and they follow wherever a visitor zooms in.
      - key: FEEDS
        value: adsblol,adsbfi,ais
      - key: SCENARIO
        value: english-channel
      - key: OPENSKY_AREA
        value: world
      # A world poll costs 4 credits. Every 3 minutes is at most 1,920 a day
      # even if someone watches around the clock, leaving 2,080 of the
      # account's 4,000 for your home server, which shares it.
      - key: OPENSKY_POLL_S
        value: "180"
      # Viewport, not world: a worldwide AIS stream is hundreds of messages a
      # second, which a 0.1-vCPU instance should not chew through for ships
      # nobody is looking at. Viewport mode subscribes only to what viewers
      # actually watch...
      - key: AIS_AREA
        value: viewport
      # ...and views wider than about 25 x 25 degrees aren't streamed, so the
      # opening globe doesn't ask for every ship on earth: ships appear once a
      # visitor zooms in to a region.
      - key: AIS_MAX_AREA
        value: "600"
      # Render sits behind Cloudflare, which overwrites CF-Connecting-IP with
      # the visitor's address (Render's own proxy appends to X-Forwarded-For,
      # which a visitor can forge). Per-visitor limits are kept against it.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip,true-client-ip
      # Each connection costs a whole snapshot; a household needs a few.
      - key: MAX_CONNECTIONS_PER_ADDRESS
        value: "8"
      # Rooms for strangers: any number up to this, at most three per
      # address, and wrong codes counted per address.
      - key: ROOMS_MAX
        value: "200"
      # The server fetches no satellites on the free tier: no disk survives a
      # sleep, so every wake would download CelesTrak's catalogue again, and
      # CelesTrak refuses repeat downloads within its 2-hour update and
      # firewalls addresses that collect refusals (Render's are shared).
      # Visitors still see them: told the server has none, each browser
      # fetches them from CelesTrak itself, as the static demo does.
      - key: SATELLITES
        value: "off"
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
