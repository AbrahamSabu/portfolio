<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCAT Prep</title>
<meta name="description" content="A free UCAT study planner and practice app: a day-by-day plan to your test date, AI-written practice questions, timed sections, mocks and an error log.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#E6E8EC}
:root{--paper:#E6E8EC;--card:#fff;--ink:#131E33;--ink2:#38425A;--muted:#6B7488;--rule:#CBD1DC;
--done:#0D6E5C;--doneBg:#E1EFEB;--alert:#A8372A;--alertBg:#FBEDEA;--warn:#8A6410}
#u{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:15px;
line-height:1.5;padding:22px 16px 70px;max-width:860px;margin:0 auto;-webkit-font-smoothing:antialiased}
#u h1,#u h2,#u h3,#u h4{font-family:'Archivo',sans-serif;margin:0;font-weight:600;letter-spacing:-.015em}
#u p{margin:0}#u button{font-family:inherit;font-size:inherit;color:inherit}
#u :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.count{font-family:'Archivo',sans-serif;font-weight:700;font-size:52px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.count span{font-size:20px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:8px;font-size:13.5px}
.strip{display:flex;gap:4px;align-items:flex-end;height:38px;margin-top:18px}
.cell{flex:1;background:#D5D9E1;display:flex;align-items:flex-end;height:22px}
.cell i{display:block;width:100%;background:var(--done)}
.cell.today{height:38px;box-shadow:inset 0 0 0 2px var(--ink)}
.cell.past{background:#C2C7D2}.cell.exam{flex:0 0 16px;height:38px;background:var(--alert)}
.striplab{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin-top:7px;gap:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:24px 0 20px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 13px;cursor:pointer;color:var(--muted);font-weight:500;
border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.phase{margin:24px 0 10px}.phase h2{font-size:16px}
.phase p{color:var(--muted);font-size:13.5px;margin-top:3px}
.day{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--rule);margin-bottom:6px}
.day.complete{border-left-color:var(--done)}.day.now{border-left-color:var(--ink);border-left-width:5px}
.dhead{width:100%;display:flex;align-items:baseline;gap:10px;padding:13px 14px;background:none;border:0;cursor:pointer;text-align:left}
.dnum{font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;flex:0 0 auto}
.ddate{color:var(--muted);font-size:13px;flex:0 0 auto}
.dtitle{font-weight:500;font-size:14px;flex:1 1 auto;min-width:0}
.dmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.dmeta.ok{color:var(--done);font-weight:600}
.dbody{padding:0 14px 14px;display:none}.day.open .dbody{display:block}
.task{display:flex;gap:11px;padding:9px 0;border-top:1px solid #EDEFF3;cursor:pointer;align-items:flex-start}
.box{flex:0 0 17px;height:17px;margin-top:2px;border:1.5px solid var(--muted);background:#fff;position:relative}
.task.done .box{background:var(--done);border-color:var(--done)}
.task.done .box::after{content:"";position:absolute;left:5px;top:1.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.task span{font-size:14.2px;color:var(--ink2)}
.task.done span{color:var(--muted);text-decoration:line-through}
.drills{margin-top:12px;padding-top:12px;border-top:1px solid #EDEFF3}
.drills h4{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.drill{display:flex;align-items:center;gap:10px;padding:7px 0}
.drill .bar{flex:1;height:5px;background:#E4E7ED;min-width:50px}
.drill .bar i{display:block;height:100%;background:var(--done)}
.drill b{font-family:'Archivo',sans-serif;font-size:13px;flex:0 0 104px}
.drill em{font-style:normal;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.drill button{border:1px solid var(--rule);background:#fff;padding:4px 10px;cursor:pointer;font-size:12.5px}
.drill button:hover{border-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--rule);padding:16px;margin-bottom:12px}
.panel h3{font-size:15.5px;margin-bottom:10px}
.figs{display:flex;gap:24px;flex-wrap:wrap}
.figs div b{display:block;font-family:'Archivo',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.figs div small{color:var(--muted);font-size:12.5px}
.modebar{display:flex;border:1px solid var(--rule);background:var(--card);margin-bottom:12px}
.modebar button{flex:1;background:none;border:0;padding:10px;cursor:pointer;color:var(--muted);text-align:left}
.modebar button[aria-pressed=true]{background:var(--ink);color:#fff}
.modebar b{display:block;font-family:'Archivo',sans-serif;font-size:13.5px}
.modebar small{font-size:11.5px;opacity:.75}
.sec{width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--rule);
padding:14px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:12px}
.sec:hover{border-left-color:var(--ink)}
.sec:disabled{opacity:.5;cursor:default}
.sec .g{flex:1;min-width:0}.sec h3{font-size:15.5px}
.sec p{color:var(--muted);font-size:12.8px;margin-top:2px}
.stat{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.stat b{font-family:'Archivo',sans-serif;font-size:17px;display:block}
.stat small{color:var(--muted);font-size:11.5px}
.qbar{display:flex;align-items:center;gap:11px;background:var(--ink);color:#fff;padding:11px 14px;flex-wrap:wrap}
.qbar .n{font-family:'Archivo',sans-serif;font-weight:600;font-size:14px}
.qbar .sp{flex:1}
.clock{font-family:'Archivo',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.clock.warn{color:#FFD466}.clock.over{color:#FF9C8C}
.qbar small{opacity:.75;font-size:11.5px}
.qbar .fl{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 9px;cursor:pointer;font-size:12px}
.qbar .fl[aria-pressed=true]{background:#FFD466;color:var(--ink);border-color:#FFD466}
.pace{height:3px;background:rgba(255,255,255,.25);width:100%;margin-top:9px}
.pace i{display:block;height:100%;background:#fff}.pace i.warn{background:#FFD466}.pace i.over{background:#FF9C8C}
.qbox{background:var(--card);border:1px solid var(--rule);border-top:0;padding:18px 16px}
.ctx{background:#F7F8FA;border-left:2px solid var(--rule);padding:13px 14px;margin-bottom:16px;font-size:14.3px;line-height:1.62;color:var(--ink2)}
.ctx p+p{margin-top:9px}
table{width:100%;border-collapse:collapse;font-size:13.4px;background:#fff}
th,td{border:1px solid var(--rule);padding:6px 8px;text-align:left;font-variant-numeric:tabular-nums}
th{background:#EEF0F4;font-weight:600}
.stem{font-weight:500;margin-bottom:14px;font-size:15.2px}
.budgetnote{background:#F2F4F8;border-left:2px solid var(--ink);padding:9px 12px;margin-bottom:14px;font-size:13.3px;color:var(--ink2)}
.splits{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-top:12px;padding-top:11px;border-top:1px solid #EDEFF3}
.splits b{font-family:'Archivo',sans-serif;color:var(--ink);font-weight:600}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);padding:11px 12px;margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .k{flex:0 0 20px;height:20px;border:1.5px solid var(--muted);font-size:11.5px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--ink);background:#F2F4F8}
.opt[aria-pressed=true] .k{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right{border-color:var(--done);background:var(--doneBg)}
.opt.right .k{background:var(--done);border-color:var(--done);color:#fff}
.opt.wrong{border-color:var(--alert);background:var(--alertBg)}
.opt.wrong .k{background:var(--alert);border-color:var(--alert);color:#fff}
.opt span{font-size:14.3px}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);padding:9px 11px;margin-bottom:6px;background:#fff}
.row span{flex:1;font-size:14.2px}
.row button{border:1px solid var(--rule);background:#fff;padding:5px 13px;cursor:pointer;font-size:13px}
.row button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row button.right{background:var(--done);border-color:var(--done);color:#fff}
.row button.wrong{background:var(--alert);border-color:var(--alert);color:#fff}
.exp{margin-top:14px;padding:12px 13px;font-size:14px;line-height:1.55;background:var(--doneBg);border-left:2px solid var(--done);color:#1F3A34}
.exp.bad{background:var(--alertBg);border-left-color:var(--alert);color:#5F2A21}
.exp b{display:block;font-family:'Archivo',sans-serif;margin-bottom:4px}
.tagline{font-size:12px;color:var(--muted);margin-top:8px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:0;padding:11px 20px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.calc{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--ink);padding:9px;width:190px;z-index:9}
.calc input{width:100%;text-align:right;font-family:'Archivo',sans-serif;font-size:19px;padding:6px;border:1px solid var(--rule);margin-bottom:6px;font-variant-numeric:tabular-nums}
.calc div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.calc button{padding:8px 0;border:1px solid var(--rule);background:#F7F8FA;cursor:pointer;font-size:13.5px}
.calctog{position:fixed;right:14px;bottom:14px;background:var(--ink);color:#fff;border:0;padding:9px 13px;cursor:pointer;z-index:9}
.rev{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--done);padding:13px 14px;margin-bottom:6px}
.rev.bad{border-left-color:var(--alert)}
.rev h4{margin:0 0 6px;font-size:13.5px;display:flex;gap:9px;flex-wrap:wrap}
.rev h4 em{font-style:normal;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.rev p{font-size:13.8px;color:var(--ink2)}
.rev .ans{font-size:13.2px;color:var(--muted);margin:5px 0 7px}
.ref{background:var(--card);border:1px solid var(--rule);padding:16px;margin-bottom:10px}
.ref h3{font-size:15.5px}
.nums{display:flex;flex-wrap:wrap;gap:14px;margin:9px 0 12px;padding-bottom:12px;border-bottom:1px solid #EDEFF3}
.nums div{font-size:12.5px;color:var(--muted)}
.nums b{display:block;font-family:'Archivo',sans-serif;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.ref ul{margin:0;padding-left:17px}.ref li{margin-bottom:7px;font-size:14.2px;color:var(--ink2)}
.trap{margin-top:11px;padding:9px 11px;background:var(--alertBg);border-left:2px solid var(--alert);font-size:13.5px;color:#6E2C22}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;align-items:baseline}
.keys kbd{font-family:'Archivo',sans-serif;font-weight:600;background:#F2F4F8;border:1px solid var(--rule);padding:2px 7px;font-size:12.5px;white-space:nowrap}
.keys span{color:var(--ink2)}
.tt{width:100%;border-collapse:collapse;background:var(--card);font-size:13.6px}
.tt th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 6px}
.tt td{border:0;border-bottom:1px solid #EDEFF3;padding:9px 6px}
.tt td.b{font-family:'Archivo',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.tt .mini{height:6px;background:#E4E7ED;width:100%;min-width:56px;display:block}
.tt .mini i{display:block;height:100%}
.msg{background:var(--card);border:1px solid var(--rule);padding:26px 18px;text-align:center;color:var(--muted)}
.msg b{display:block;font-family:'Archivo',sans-serif;color:var(--ink);font-size:16px;margin-bottom:5px}
.prog{height:5px;background:#E4E7ED;margin:14px auto 0;max-width:280px}
.prog i{display:block;height:100%;background:var(--ink)}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.note{color:var(--muted);font-size:12.8px;margin-top:14px;line-height:1.55}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;margin:12px 0}
.navgrid button{padding:8px 0;border:1px solid var(--rule);background:#fff;cursor:pointer;font-size:12.5px;font-variant-numeric:tabular-nums}
.navgrid button.ansd{background:var(--doneBg);border-color:var(--done)}
.navgrid button.flg{background:#FBF2DC;border-color:#D8B54A}
.navgrid button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.spark{display:block}
.qwrap{display:grid;gap:16px;grid-template-columns:1fr;grid-template-areas:"text" "ans"}
.qwrap.hascalc{grid-template-columns:1fr 194px;grid-template-areas:"text calc" "ans calc"}
.qtext{grid-area:text;min-width:0}.qtext:empty{display:none}
.qans{grid-area:ans;min-width:0}
.qcalc{grid-area:calc;position:sticky;top:76px;min-width:0}
.swap{display:none}
.cbox{border:1px solid var(--ink);background:#fff;padding:10px}
.cbox h5{font-family:'Archivo',sans-serif;font-size:11px;color:var(--muted);margin:0 0 7px;font-weight:600}
.cbox input{width:100%;text-align:right;font-family:'Archivo',sans-serif;font-size:19px;padding:7px 8px;
border:1px solid var(--rule);margin-bottom:7px;font-variant-numeric:tabular-nums;background:#fff}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cgrid button{padding:11px 0;border:1px solid var(--rule);background:#F7F8FA;cursor:pointer;
font-family:'Archivo',sans-serif;font-size:14px;font-variant-numeric:tabular-nums}
.cgrid button:hover{border-color:var(--ink)}
.cgrid button.wide{grid-column:span 2}
.cnote{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4}
.librow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #EDEFF3;flex-wrap:wrap}
.librow b{font-family:'Archivo',sans-serif;flex:0 0 36px;font-size:13.5px}
.librow small{color:var(--muted);font-size:11.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:#fff;padding:7px 10px;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.ready{border-color:var(--ink);font-weight:600}
.chip.ready:hover{background:var(--ink);color:#fff}
.chip.done{background:var(--doneBg);border-color:var(--done);color:#1F3A34}
.chip.done em{font-style:normal;opacity:.65;margin-left:6px}
.chip.building{border-style:dashed;color:var(--muted);cursor:default}
.chip.empty{color:var(--muted);cursor:default;opacity:.55}
.pill{display:inline-block;background:var(--doneBg);color:var(--done);font-family:'Inter';font-size:11.5px;
font-weight:600;padding:2px 7px;margin-left:6px;vertical-align:middle;letter-spacing:0}
.stockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);
border:1px solid var(--rule);padding:10px 13px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.lnk{background:none;border:0;padding:0;margin-top:9px;cursor:pointer;color:var(--muted);
font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.ctpad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:250px;margin-top:10px}
.ctpad button{padding:13px 0;border:1px solid var(--rule);background:#F7F8FA;cursor:pointer;
font-family:'Archivo',sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
.ctpad button:disabled{opacity:.32;cursor:not-allowed}
.ctdisp{max-width:250px;border:1px solid var(--rule);background:#fff;padding:9px 11px;text-align:right;
font-family:'Archivo',sans-serif;font-size:21px;font-variant-numeric:tabular-nums;min-height:44px;word-break:break-all}
.cttarget{font-family:'Archivo',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em;
font-variant-numeric:tabular-nums;margin:4px 0 2px}
.ctmeta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.ctbad{color:var(--alert);font-size:13px;margin-top:8px}
.ctrow{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px}
@media(max-width:560px){
  #u{padding:16px 12px 90px;font-size:15.5px}
  .count{font-size:40px}.count span{font-size:17px}
  .dhead{flex-wrap:wrap}.dtitle{flex-basis:100%;order:5}
  .figs{gap:16px}.figs div b{font-size:24px}
  .drill b{flex-basis:84px;font-size:12.5px}
  .keys{grid-template-columns:1fr;gap:3px 0}
  .keys kbd{justify-self:start;margin-top:8px}
  .tabs{gap:0}.tab{padding:10px 10px;font-size:14px}
  /* keep the timer on screen while you scroll a passage */
  .qbar{position:sticky;top:0;z-index:6;padding:10px 12px;gap:8px}
  .qbar small{flex-basis:100%;order:9;margin-top:-4px}
  .qbox{padding:14px 12px}
  .ctx{padding:12px;font-size:14.6px;line-height:1.66}
  .opt{padding:13px 12px}.opt span{font-size:14.6px}
  .row{padding:11px}.row button{padding:8px 16px}
  .acts{gap:6px}.acts .btn{flex:1 1 44%;padding:13px 10px;text-align:center}
  .navgrid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  .navgrid button{padding:11px 0}
  /* calculator becomes a bottom sheet rather than a floating box */
  .calc{left:12px;right:12px;bottom:12px;width:auto;padding:12px}
  .calc div{gap:6px}.calc button{padding:14px 0;font-size:16px}
  .calctog{left:12px;right:12px;bottom:12px;padding:13px}
  .ctpad{max-width:none}.ctdisp{max-width:none}
  .qwrap,.qwrap.hascalc{grid-template-columns:1fr;grid-template-areas:"text" "ans" "calc";gap:12px}
  .qcalc{position:sticky;bottom:0;background:var(--card);padding-top:8px;z-index:5;
    box-shadow:0 -8px 12px -8px rgba(19,30,51,.25)}
  .cgrid button{padding:13px 0;font-size:15px}
  /* reclaim the screen while a question is open */
  #u.running .count,#u.running .sub,#u.running .strip,#u.running .striplab{display:none}
  #u.running{padding-top:12px}
  .tt{font-size:13px}.tt th,.tt td{padding:8px 4px}
}
/* phone held sideways: calculator, answers, then the passage or table */
@media (orientation:landscape) and (max-height:560px){
  #u{max-width:none;padding:8px 10px 12px;font-size:14.5px}
  #u.running .count,#u.running .sub,#u.running .strip,#u.running .striplab,#u.running .tabs{display:none}
  .swap{display:inline-block}
  .qbar{padding:7px 10px;gap:8px}
  .qbar small{flex-basis:auto;order:0;margin-top:0}
  .qbox{padding:10px}
  .qwrap{grid-template-columns:1fr 1.15fr;grid-template-areas:"ans text";gap:10px}
  .qwrap.hascalc{grid-template-columns:140px 1fr 1.05fr;grid-template-areas:"calc ans text"}
  .qwrap.flip{grid-template-areas:"text ans"}
  .qwrap.hascalc.flip{grid-template-areas:"text ans calc"}
  .qtext,.qans{max-height:calc(100vh - 96px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .qcalc{position:static;box-shadow:none;padding-top:0}
  .cbox{padding:7px}.cbox h5{display:none}
  .cbox input{font-size:16px;padding:5px 6px;margin-bottom:5px}
  .cgrid{gap:3px}.cgrid button{padding:8px 0;font-size:13px}.cnote{display:none}
  .ctx{padding:9px 10px;font-size:13.6px;line-height:1.55;margin-bottom:10px}
  .stem{font-size:14.2px;margin-bottom:9px}
  .opt{padding:8px 9px;margin-bottom:4px}.opt span{font-size:13.6px}
  .opt .k{flex-basis:18px;height:18px}
  .row{padding:7px 9px;margin-bottom:4px}.row span{font-size:13.4px}

function buildPlan(startISO,examISO){
  const start=parseISO(startISO)||new Date(),exam=parseISO(examISO);
  start.setHours(0,0,0,0);
  let n=Math.round((exam-start)/DAY_MS);
  if(!(n>=1))return [];
  n=Math.min(n,120);
  const dates=Array.from({length:n},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
  const taperN=n>=3?2:n,learnN=n>=3?Math.max(1,Math.min(6,Math.round((n-2)/2))):0,buildN=n-taperN-learnN;
  const learn=[TPL.orient,TPL.vrdm,TPL.qrsjt];while(learn.length<learnN)learn.push(learn.length%2?TPL.drillAB:TPL.drillCD);
  const build=[];let tests=["A","B","C","D"],alt=0;
  for(let i=0;i<buildN;i++){
    const d=dates[learnN+i],weekend=d.getDay()===0||d.getDay()===6;
    if(i===0&&buildN>1){build.push(TPL.firstSection);continue;}
    if(weekend&&tests.length){build.push(TPL.official(tests.shift()));continue;}
    build.push((alt++)%2?TPL.mixed:TPL.section);
  }
  if(tests.length===4&&buildN>=2)build[buildN-1]=TPL.official(tests.shift());
  const taper=(taperN===2?[TPL.clear,TPL.taper]:[TPL.taper]).slice(0,taperN);
  let k=0;const mk=t=>{const d=dates[k++];return Object.assign({n:k,date:shortDate(d),iso:toISO(d)},JSON.parse(JSON.stringify(t)));};
  const span=(a,b)=>a===b?`Day ${a}`:`Days ${a}–${b}`;
  const out=[];
  if(learnN){const a=k+1,ds=learn.slice(0,learnN).map(mk);
    out.push({t:"Learn the machine",d:`${span(a,k)}. Learn the interface and the four question formats before anything else.`,days:ds});}
  if(buildN){const a=k+1,ds=build.map(mk);
    out.push({t:"Run it at full length",d:`${span(a,k)}. Sets of four questions don't test stamina. From here you sit whole sections, and the official practice tests land on weekends.`,days:ds});}
  {const a=k+1,ds=taper.map(mk);
    out.push({t:"Sharpen and taper",d:`${span(a,k)}. No new material. Clear the error log, protect the SJT, arrive rested.`,days:ds});}
  return out;
}

let lastErr="";
function parseLoose(txt){
  let t=String(txt||"").replace(/```json|```/g,"").trim();
  const a=t.indexOf("{");if(a>0)t=t.slice(a);
  try{return JSON.parse(t);}catch(e){}
  // response was cut off mid-JSON: keep the items that did complete
  for(let i=t.length;i>0;i--){
    if(t[i-1]!=="}")continue;
    for(const tail of ["]}","}]}","}"]){
      try{const o=JSON.parse(t.slice(0,i)+tail);
        if(o&&Array.isArray(o.items)&&o.items.length)return o;}catch(e){}
    }
  }
  throw new Error("could not parse the model's JSON");
}
async function callText(prompt,tries){
  tries=tries||0;
  try{
    let headers={"Content-Type":"application/json"},body;
    if(IN_CLAUDE){
      // inside claude.ai the artifact runtime handles auth
      body={model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]};
    }else{
      if(!KEY)throw new Error("no API key yet");
      const model=CFG.model||"claude-opus-5-5";
      headers=Object.assign(headers,{"x-api-key":KEY,"anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"});
      // thinking is on by default for these models, so leave room for it plus the JSON
      body={model,max_tokens:16000,output_config:{effort:"medium"},messages:[{role:"user",content:prompt}]};
      if(!/haiku/.test(model)){headers["anthropic-beta"]="server-side-fallback-2026-07-01";body.fallbacks="default";}
    }
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
    if(!r.ok){let m="http "+r.status;try{const e=await r.json();if(e&&e.error&&e.error.message)m+=": "+e.error.message;}catch(_){}
      if(r.status===401){tries=9;m="your API key was rejected. Check it in Settings";}
      throw new Error(m);}
    const d=await r.json();
    if(d.stop_reason==="refusal")throw new Error("the model declined to write this one");
    return (d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim();
  }catch(e){lastErr=String(e&&e.message||e);if(tries<1&&canGenerate())return callText(prompt,tries+1);throw e;}
}
async function callJSON(prompt,tries){
  tries=tries||0;
  try{return parseLoose(await callText(prompt));}
  catch(e){lastErr=String(e&&e.message||e);if(tries<1)return callJSON(prompt,tries+1);throw e;}
}

function vrQuestionPrompt(passage,variant){

   ? `Passage:\n\n${passage}\n\nWrite FOUR four-option questions answerable only from this passage. Tag each with "type": use "inference", "detail", "main-idea", "except" (which of these is NOT supported) and "incomplete" (a sentence stub the candidate completes). Include at least one "incomplete".
Distractors must be true-sounding but unsupported, or supported by the passage but not answering the question asked. Each explanation ONE short sentence naming the deciding wording.
Every option must be clearly distinct. "answer" must be an exact character-for-character copy of the correct option string.\nReturn ONLY JSON: {"items":[{"stem":"..","options":["a","b","c","d"],"correct":0,"answer":"exact text of the correct option","type":"inference","explanation":".."}]}`
   : `Passage:\n\n${passage}\n\nWrite FOUR statements to be judged True / False / Can't tell strictly on this passage. "True" = fully supported, "False" = contradicted, "Can't tell" = the passage does not settle it.
Use at least two different answer values. Include one statement using an absolute (always/never/only/all), one that is plausible from general knowledge but absent from the passage, and one that shifts the scope or quantity of something the passage does say. Each explanation ONE short sentence naming the deciding wording.
Return ONLY JSON: {"items":[{"statement":"..","answer":"True|False|Can't tell","explanation":".."}]}`;

const TRUEY=["true","yes","y","1","t"];
function toBools(v){
  if(!Array.isArray(v))return v;
  return v.map(x=>typeof x==="boolean"?x:TRUEY.indexOf(String(x).trim().toLowerCase())>=0);
}
const numsIn=s=>(String(s).match(/-?\d[\d,]*\.?\d*/g)||[]).map(x=>parseFloat(x.replace(/,/g,"")));
const normTxt=x=>String(x==null?"":x).toLowerCase().replace(/[\s,£$%()]/g,"");
function resolveCorrect(it,options){
  if(typeof it.answer==="string"&&it.answer.trim()){
    const i=options.findIndex(o=>normTxt(o)===normTxt(it.answer));
    if(i>=0)return i;
  }
  return typeof it.correct==="number"?it.correct:-1;
}
// the explanation's own numbers must point at the option marked correct
function optVal(o){
  const t=String(o).replace(/,/g,"");
  const f=t.match(/(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);   // 1/3, 2/5
  if(f&&parseFloat(f[2]))return parseFloat(f[1])/parseFloat(f[2]);
  const n=t.match(/-?\d+(?:\.\d+)?/);
  return n?parseFloat(n[0]):NaN;
}
function arithmeticAgrees(q){
  const opt=q.options.map(optVal);
  if(opt.some(v=>!isFinite(v)))return true;          // wordy options, nothing to check
  if(new Set(opt).size!==opt.length)return false;     // duplicate values = ambiguous
  const ex=numsIn(q.explanation);
  if(!ex.length)return true;
  // only the concluding figures count - intermediate working can sit near a distractor by chance
  return ex.slice(-2).some(v=>{
    let best=0,bd=Infinity;
    opt.forEach((ov,i)=>{const d=Math.abs(ov-v);if(d<bd){bd=d;best=i;}});
    return best===q.correct;
  });
}
let uidN=0;
function normalise(sec,raw,variant){
  const out=[],uid=()=>sec+"-"+(Date.now().toString(36))+(uidN++).toString(36);
  if(sec==="VR"&&variant==="mcq"){
    (raw.items||[]).forEach(it=>out.push({id:uid(),sec,format:"mcq",context:raw.context,ctxHtml:true,
      stem:it.stem,options:it.options,correct:resolveCorrect(it,it.options||[]),qtype:it.type||"inference",explanation:it.explanation}));
  }else if(sec==="VR"){
    (raw.items||[]).forEach(it=>out.push({id:uid(),sec,format:"mcq",context:raw.context,ctxHtml:true,
      stem:it.statement,options:["True","False","Can't tell"],
      correct:["true","false","can't tell"].indexOf(String(it.answer).toLowerCase().replace("cant","can't")),
      qtype:"tfct",explanation:it.explanation}));
  }else if(sec==="DM"){
    (raw.items||[]).forEach(it=>out.push({id:uid(),sec,format:it.format==="yesno"?"yesno":"mcq",
      context:it.context||null,stem:it.stem,options:it.options,rows:it.rows,
      correct:it.format==="yesno"?toBools(it.correct):resolveCorrect(it,it.options||[]),
      qtype:it.type||"conclusion",explanation:it.explanation}));
  }else if(sec==="QR"){
    let t=`<p>${esc(raw.intro||"")}</p>`;
    if((raw.headers||[]).length&&(raw.rows||[]).length){
      t+=`<div class="tw"><table><tr>${raw.headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>`;
      raw.rows.forEach(r=>{t+=`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`;});t+="</table></div>";}
    (raw.items||[]).forEach(it=>out.push({id:uid(),sec,format:"mcq",context:t,ctxHtml:true,stem:it.stem,
      options:it.options,correct:resolveCorrect(it,it.options||[]),qtype:it.type||"lookup",explanation:it.explanation}));
  }else{
    const imp=raw.kind==="importance";
    (raw.items||[]).forEach(it=>out.push({id:uid(),sec,format:"mcq",context:raw.context,scale:true,
      stem:(imp?"How important is this consideration? — ":"How appropriate is this response? — ")+it.response,
      options:imp?SJT_IMPORT:SJT_APPROP,correct:typeof it.correct==="number"?it.correct:-1,qtype:it.type||"patient-safety",explanation:it.explanation}));
  }
  return out.filter(q=>{
    if(!q.stem)return false;
    if(q.format==="yesno")return Array.isArray(q.rows)&&Array.isArray(q.correct)&&q.rows.length===q.correct.length;
    if(!Array.isArray(q.options)||!(q.correct>=0)||q.correct>=q.options.length)return false;
    if(new Set(q.options.map(normTxt)).size!==q.options.length)return false;
    if(q.sec==="QR"&&!q.scale&&!arithmeticAgrees(q))return false;
    return true;
  });
}
const vrVariant=()=>Math.random()<0.45?"mcq":"tfct";
async function oneSet(sec){

async function pool(n,fn,limit,onProg){
  const out=[];let i=0,done=0;
  async function worker(){while(i<n){i++;try{out.push(...await fn());}catch(e){}done++;if(onProg)onProg(done,n);}}
  await Promise.all(Array.from({length:Math.min(limit,n)},worker));
  return out;
}

function scoreOf(q,a){
  if(a==null)return 0;
  if(q.format==="yesno"){const n=q.correct.filter((c,i)=>c===a[i]).length;return n===q.correct.length?1:(n>=q.correct.length-1?.5:0);}
  if(q.scale){const d=Math.abs(a-q.correct);return d===0?1:(d===1?.5:0);}
  return a===q.correct?1:0;
}
const maxOf=q=>q.format==="yesno"?2:1;
const marksOf=(q,a)=>scoreOf(q,a)*maxOf(q);
function recordQ(q,a,secs){
  const sc=scoreOf(q,a);
  const st=S.stats[q.sec]=S.stats[q.sec]||{n:0,pts:0,secs:0};
  st.n++;st.pts+=sc;st.secs+=secs||0;
  const tk=q.sec+"|"+q.qtype;const t=S.types[tk]=S.types[tk]||{n:0,pts:0};t.n++;t.pts+=sc;
  const idx=S.bank.findIndex(b=>b.q.id===q.id);
  if(sc<1){
    if(idx<0)S.bank.push({q:q,miss:1,streak:0,when:Date.now()});
    else{S.bank[idx].miss++;S.bank[idx].streak=0;S.bank[idx].when=Date.now();}
  }else if(idx>=0){
    S.bank[idx].streak++;
    if(S.bank[idx].streak>=2)S.bank.splice(idx,1);
  }
  if(S.bank.length>60){S.bank.sort((a,b)=>b.miss-a.miss||b.when-a.when);S.bank=S.bank.slice(0,60);}
  return sc;
}
function undoQ(q,a,secs){
  const sc=scoreOf(q,a);
  const st=S.stats[q.sec];if(st){st.n=Math.max(0,st.n-1);st.pts=Math.max(0,st.pts-sc);st.secs=Math.max(0,st.secs-(secs||0));}
  const t=S.types[q.sec+"|"+q.qtype];if(t){t.n=Math.max(0,t.n-1);t.pts=Math.max(0,t.pts-sc);}

function logSession(kind,sec,pts,n,secs,qn){

const sessionsOn=(iso,f)=>S.sessions.filter(x=>x.d===iso&&(!f||f(x)));
function targetDone(d,t){const k=t[0];
  if(k==="SECTION")return sessionsOn(d.iso,x=>x.kind==="section").length;
  if(k==="MOCK")return sessionsOn(d.iso,x=>x.kind==="mock").length;
  if(k==="REDO")return sessionsOn(d.iso,x=>x.kind==="redo").length;
  return sessionsOn(d.iso,x=>x.kind==="drill"&&x.sec===k).length;}
const dayTarget=d=>d.sets.reduce((a,t)=>a+t[1],0);
const dayDoneSets=d=>d.sets.reduce((a,t)=>a+Math.min(t[1],targetDone(d,t)),0);

function avgSetSecs(sec){const r=S.sessions.filter(x=>x.sec===sec&&x.kind==="drill");
  if(r.length<2)return budget(sec);return r.slice(-6).reduce((a,x)=>a+x.secs,0)/Math.min(6,r.length);}

function seedStock(){

  SEED.forEach(sd=>{

    if(S.ready[sd.sec].some(x=>x.seeded))return;

async function topUp(force){
  if(warming||!canGenerate())return;
  const need=ORDER.filter(k=>stock(k)<STOCK_TARGET);
  if(!need.length)return;
  warming=true;if(tab==="practice"&&pview==="home")render();
  try{
    for(const k of need){
      while(stock(k)<STOCK_TARGET){
        let batch=[];
        try{batch=await Promise.all([oneSet(k),oneSet(k)]);}catch(e){break;}
        batch.filter(q=>q&&q.length).forEach(qs=>{(S.ready[k]=S.ready[k]||[]).push({qs});});
        save();
        if(tab==="practice"&&pview==="home")render();
        if(!batch.some(q=>q&&q.length))break;
      }
    }
  }finally{warming=false;if(tab==="practice"&&pview==="home")render();}
}
function takeStock(sec){
  const list=S.ready[sec]||[];
  if(!list.length)return null;
  const i=list.findIndex(x=>!x.seeded);
  const item=list.splice(i>=0?i:0,1)[0];
  save();
  return item.qs;
}
async function buildLibrary(){
  if(libJob||!canGenerate())return;
  libFailed=false;libJob={sec:null,n:0,done:0,total:0};libRefresh();
  try{
    // round-robin, so one full mock of every section exists before any section gets a second
    for(let round=1;round<=LIB_TARGET;round++){
      for(const sec of ORDER){
        if((LIB[sec]||[]).length>=round)continue;
        const calls=Math.ceil(SECTIONS[sec].realQ/SECTIONS[sec].n);
        Object.assign(libJob,{sec,n:(LIB[sec]||[]).length+1,done:0,total:calls});libRefresh();
        const qs=await pool(calls,()=>oneSet(sec),3,d=>{libJob.done=d;libRefresh();});
        if(qs.length<Math.ceil(SECTIONS[sec].realQ*0.75)){libFailed=true;return;}
        (LIB[sec]=LIB[sec]||[]).push({id:sec+"-"+Date.now().toString(36),n:LIB[sec].length+1,
          qs:qs.slice(0,SECTIONS[sec].realQ),built:Date.now(),result:null});
        await saveLib();libRefresh();
      }
    }
  }finally{libJob=null;libRefresh();}
}

async function startMock(){

function clock(){
  clearInterval(tick);

    if(!R||pview!=="run")return clearInterval(tick);
    const el=$("clock"),bar=$("paceBar"),lf=$("left");if(!el)return;
    if(R.kind==="section"||R.kind==="mock"){
      const left=R.limit-Math.floor((Date.now()-R.t0)/1000);

      if(bar){bar.style.width=Math.max(0,left)/R.limit*100+"%";bar.className=left<300?"warn":"";}
      if(left<=0){clearInterval(tick);endSection();}
    }else{
      const s=Math.floor((Date.now()-R.setT0)/1000),b=budget(R.sec);
      el.textContent=fmt(s)+" / "+fmt(b);el.className="clock"+(s>b?" over":"");
      if(bar){bar.style.width=Math.min(100,s/b*100)+"%";bar.className=s>b?"over":"";}
      if(lf){const r=b-s,q=R.qs.length-R.i;

}
function choose(v){

function qParts(q,ansVal,revealed){
  const ctx=q.context?`<div class="ctx">${q.ctxHtml?q.context:"<p>"+esc(q.context).replace(/\n+/g,"</p><p>")+"</p>"}</div>`:"";
  let body=`<p class="stem">${esc(q.stem)}</p>`;
  if(q.format==="yesno"){
    const p=Array.isArray(ansVal)?ansVal:[];
    body+=q.rows.map((r,i)=>{const cor=q.correct[i];
      const cls=v=>revealed?(v===cor?"right":(p[i]===v?"wrong":"")):"";
      return `<div class="row"><span>${esc(r)}</span>
      <button class="${cls(true)}" data-r="${i}" data-v="1" aria-pressed="${p[i]===true}">Yes</button>
      <button class="${cls(false)}" data-r="${i}" data-v="0" aria-pressed="${p[i]===false}">No</button></div>`;}).join("");

function calcKey(k){
  if(k==="C")calcVal="";
  else if(k==="="){try{const r=Function("return ("+calcVal.replace(/%/g,"/100")+")")();
    calcVal=isFinite(r)?String(Math.round(r*1e10)/1e10):"Error";}catch(_){calcVal="Error";}}
  else{if(calcVal==="Error")calcVal="";calcVal+=k;}
  const el=$("cval");
  if(el)el.value=calcVal; else mountCalc(true);
}
document.addEventListener("keydown",e=>{
  if(CT&&!CT.done&&tab==="know"){
    if(CT.mode!=="keys")return;
    if(/^[0-9.+\-*/]$/.test(e.key)){e.preventDefault();ctInput(e.key);return;}
    if(e.key==="Enter"||e.key==="="){e.preventDefault();ctInput("=");return;}
    if(e.key==="Backspace"){e.preventDefault();ctInput("C");return;}
    return;
  }
  if(pview!=="run"||!R)return;
  const sectionish=R.kind==="section"||R.kind==="mock",k=e.key.toLowerCase();
  if(e.altKey){
    if(k==="n"){e.preventDefault();if(sectionish)go(1);else if($("sb")&&!$("sb").disabled)submitDrill();else if($("nx"))nextDrill();}
    else if(k==="p"&&sectionish){e.preventDefault();go(-1);}
    else if(k==="f"&&sectionish){e.preventDefault();R.flags[R.i]=!R.flags[R.i];render();}
    else if(k==="s"&&sectionish){e.preventDefault();R.review=!R.review;render();}
    else if(k==="c"&&SECTIONS[R.sec].calc){e.preventDefault();const el=$("cval");if(el){el.focus();el.blur();}}
    return;
  }
  if(SECTIONS[R.sec].calc){
    if(/^[0-9.+\-*/]$/.test(e.key)){e.preventDefault();calcKey(e.key);return;}
    if(e.key==="Enter"||e.key==="="){e.preventDefault();calcKey("=");return;}
    if(e.key==="Backspace"){e.preventDefault();calcKey("C");return;}
  }
  if(R.review)return;
  const q=R.qs[R.i];
  if(q.format!=="yesno"&&/^[a-e]$/.test(k)){const i="abcde".indexOf(k);if(i<q.options.length)choose(i);}
});
function syncTabs(){document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.t===tab));}
function wire(){
  const v=$("view"),g=id=>$(id);
  v.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const n=+b.dataset.day;open=(open===n?-1:n);render();});
  v.querySelectorAll(".task").forEach(t=>t.onclick=()=>{const k=t.dataset.k;S.done[k]=!S.done[k];if(!S.done[k])delete S.done[k];save();render();});
  v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const x=b.dataset.go;
    if(x==="REDO")startRedo();
    else if(x==="SECTION"||x==="MOCK"){tab="practice";pview="home";R=null;syncTabs();render();}
    else startDrill(x);});
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>calcKey(b.dataset.c));
  v.querySelectorAll("[data-buildlib]").forEach(b=>b.onclick=()=>buildLibrary());
  v.querySelectorAll("[data-lib]").forEach(b=>b.onclick=()=>{const p=b.dataset.lib.split("|");startLib(p[0],p[1]);});
  v.querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>topUp(true));
  v.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{lastKind==="section"?startSection(lastSec,null):startDrill(lastSec);});
  v.querySelectorAll("[data-sect]").forEach(b=>b.onclick=()=>startSection(b.dataset.sect,null));
  v.querySelectorAll("[data-mock]").forEach(b=>b.onclick=()=>startMock());
  v.querySelectorAll("[data-m]").forEach(b=>{if(b.tagName==="BUTTON")b.onclick=()=>{mode=b.dataset.m;render();};});
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  v.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>choose({r:+b.dataset.r,val:b.dataset.v==="1"}));
  v.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{R.i=+b.dataset.jump;R.review=false;render();});
  v.querySelectorAll("input[data-mk],select[data-mk]").forEach(el=>el.onchange=()=>{
    const i=el.dataset.mk;S.mocks[i]=S.mocks[i]||{};S.mocks[i][el.dataset.f]=el.value;save();render();});
  v.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{
    const x=b.dataset.ct;if(x==="done"){CT=null;render();}else ctStart(x);});
  v.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>ctInput(b.dataset.ck));
  if(g("swap"))g("swap").onclick=()=>{S.flip=!S.flip;save();render();};
  if(g("flag"))g("flag").onclick=()=>{R.flags[R.i]=!R.flags[R.i];render();};
  if(g("bad"))g("bad").onclick=()=>{undoQ(R.qs[R.i],R.ans[R.i],R.times[R.i]);render();};
  if(g("sb"))g("sb").onclick=submitDrill;
  if(g("nx"))g("nx").onclick=nextDrill;
  if(g("prevq"))g("prevq").onclick=()=>go(-1);
  if(g("nextq"))g("nextq").onclick=()=>go(1);
  if(g("revscr"))g("revscr").onclick=()=>{R.review=true;render();};
  if(g("backq"))g("backq").onclick=()=>{R.review=false;render();};
  if(g("endsec"))g("endsec").onclick=()=>{if(confirm("End this section? You can't come back to it."))endSection();};
  if(g("nextsec"))g("nextsec").onclick=()=>nextMockSection();
  if(g("abandon"))g("abandon").onclick=()=>{mockCache={};R=null;pview="home";render();};
  if(g("quit"))g("quit").onclick=()=>{clearInterval(tick);
    const answered=R.ans.filter(x=>x!=null).length;
    if(answered){R.qs=R.qs.slice(0,answered);R.setSecs=Math.round((Date.now()-R.setT0)/1000);
      logSession(R.kind==="redo"?"redo":"drill",R.sec,R.qs.reduce((a,q,i)=>a+marksOf(q,R.ans[i]),0),
        R.qs.reduce((a,q)=>a+maxOf(q),0),R.setSecs,R.qs.length);
      pview="result";}else{R=null;pview="home";}
    render();};
  if(g("phome"))g("phome").onclick=()=>{R=null;pview="home";render();};
  if(g("todiag"))g("todiag").onclick=()=>{R=null;pview="home";tab="diag";syncTabs();render();};
  v.querySelectorAll("[data-gosettings]").forEach(b=>b.onclick=()=>{tab="settings";syncTabs();render();});
  if(g("cfgSave"))g("cfgSave").onclick=()=>{
    const ex=g("cfgExam").value,st=g("cfgStart").value||isoToday();
    if(!ex){alert("Pick your test date first.");return;}
    if(ex<=st){alert("The test date needs to be after the start date.");return;}
    const changed=CFG.exam&&(ex!==CFG.exam||st!==CFG.start);
    if(changed&&!confirm("Rebuild the plan for these dates? Your ticked tasks will be cleared; practice history stays."))return;
    const firstTime=!CFG.exam;
    CFG.exam=ex;CFG.start=st;if(changed){S.done={};save();}
    saveCfg();applyCfg();open=null;
    if(firstTime){tab="plan";syncTabs();}render();};
  if(g("cfgModel"))g("cfgModel").onchange=()=>{CFG.model=g("cfgModel").value;saveCfg();};
  if(g("keySave"))g("keySave").onclick=()=>{const k=g("cfgKey").value.trim();
    if(!k){alert("Paste your API key first.");return;}
    if(!/^sk-ant-/.test(k)&&!confirm("That doesn't look like an Anthropic key (they start with sk-ant-). Save it anyway?"))return;
    KEY=k;try{localStorage.setItem("ucat:key",k);}catch(e){}
    lastErr="";render();setTimeout(()=>topUp(),300);};
  if(g("keyClear"))g("keyClear").onclick=()=>{KEY="";try{localStorage.removeItem("ucat:key");}catch(e){}render();};
  if(g("dataExport"))g("dataExport").onclick=()=>{
    const blob=new Blob([JSON.stringify({app:"ucat-prep",version:1,cfg:{exam:CFG.exam,start:CFG.start,model:CFG.model},state:S,lib:LIB},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ucat-progress-"+isoToday()+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);};
  if(g("dataImport"))g("dataImport").onchange=e=>{const f=e.target.files[0];if(!f)return;
    f.text().then(t=>{const d=JSON.parse(t);if(!d||d.app!=="ucat-prep")throw new Error("not a UCAT Prep export");
      if(!confirm("Replace your progress on this device with the imported file?"))return;
      CFG=Object.assign(CFG,d.cfg||{});S=Object.assign(S,d.state||{});LIB=Object.assign({VR:[],DM:[],QR:[],SJT:[]},d.lib||{});
      saveCfg();save();saveLib();applyCfg();render();alert("Progress imported.");})
     .catch(err=>alert("Couldn't import that file: "+err.message));};
  if(g("dataReset"))g("dataReset").onclick=()=>{
    if(!confirm("Delete your plan, practice history, error log and saved mocks on this device? Export first if you want a backup."))return;
    S={done:{},mocks:{},stats:{},types:{},sessions:[],bank:[],ctBest:{},ready:{}};LIB={VR:[],DM:[],QR:[],SJT:[]};CFG={exam:"",start:"",model:CFG.model};
    save();saveLib();saveCfg();applyCfg();seedStock();tab="settings";syncTabs();render();};
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  if(pview==="run"&&R&&b.dataset.t!==tab){
    const isSec=R.kind==="section"||R.kind==="mock";
    if(!confirm(isSec?"Leave the section? It will be abandoned.":"Leave this set? Your answers so far won't be saved."))return;}
  tab=b.dataset.t;syncTabs();
  if(tab!=="practice"){clearInterval(tick);if(pview==="run"){R=null;pview="home";}}
  render();});
Promise.all([load(),loadLib(),loadCfg()]).then(()=>{seedStock();if(!CFG.exam){tab="settings";syncTabs();}render();setTimeout(()=>topUp(),600);});
</script>
</body>
</html>
