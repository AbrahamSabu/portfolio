# Parts for Simple mode. Masses are typical values; edit or add your own parts.
airframes:
  - id: blackhawk29_710
    name: Wildman Blackhawk 29, tube cut to 710 mm
    nose: {shape: conical, length: 0.157, mass: 0.035, material: fiberglass}
    body: {length: 0.710, outer_diameter: 0.032, inner_diameter: 0.0291, material: fiberglass, mass: 0.143}
  - id: blackhawk29_full
    name: Wildman Blackhawk 29, full 915 mm tube
    nose: {shape: conical, length: 0.157, mass: 0.035, material: fiberglass}
    body: {length: 0.915, outer_diameter: 0.032, inner_diameter: 0.0291, material: fiberglass, mass: 0.1843}
  - id: generic38_800
    name: Generic 38 mm fibreglass minimum-diameter, 800 mm tube
    nose: {shape: ogive, length: 0.20, mass: 0.060, material: fiberglass}
    body: {length: 0.800, outer_diameter: 0.0405, inner_diameter: 0.0385, material: fiberglass, mass: 0.215}
fins:
